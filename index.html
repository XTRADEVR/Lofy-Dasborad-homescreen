<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Lofi Cozy Night Dashboard</title>
    <!-- Meta tag untuk PWA -->
    <meta name="theme-color" content="#1a1a2e">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Efek Hujan / Suasana Lofi */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* Container Utama (Glassmorphism) */
        .dashboard-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        /* Widget Jam */
        .clock-box {
            margin-bottom: 25px;
        }

        #digital-clock {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        #digital-date {
            font-size: 1rem;
            color: #dcdde1;
            margin-top: 5px;
        }

        /* Pemutar Musik */
        .player-box {
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 16px;
        }

        #play-music-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        #play-music-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        #music-status {
            font-size: 0.85rem;
            color: #a4b0be;
            margin-top: 10px;
        }

        /* Catatan / Memori HP */
        .note-box {
            text-align: left;
        }

        .note-box label {
            font-size: 0.9rem;
            color: #f1f2f6;
            display: block;
            margin-bottom: 8px;
        }

        #user-note {
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px;
            color: white;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            margin-bottom: 10px;
        }

        #user-note:focus {
            border-color: #00f2fe;
        }

        #save-note-btn {
            background: #00b894;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        #save-note-btn:hover {
            background: #55efc4;
            color: #2d3436;
        }

        #save-message {
            font-size: 0.8rem;
            color: #55efc4;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="dashboard-container">
        <!-- Widget Jam & Tanggal -->
        <div class="clock-box">
            <div id="digital-clock">00:00:00</div>
            <div id="digital-date">Memuat tanggal...</div>
        </div>

        <!-- Widget Pemutar Musik -->
        <div class="player-box">
            <button id="play-music-btn">🎧 Play Lofi Beats</button>
            <div id="music-status">Status: Paused</div>
            <!-- Audio Stream Lo-Fi Publik yang Stabil -->
            <audio id="lofi-audio" src="https://stream.zeno.fm/f3wvbbqmd88uv" preload="none"></audio>
        </div>

        <!-- Widget Catatan (Local Storage / Memori HP) -->
        <div class="note-box">
            <label for="user-note">📝 Catatan / Daily Goal (Tersimpan di HP):</label>
            <textarea id="user-note" placeholder="Tulis catatan atau targetmu di sini..."></textarea>
            <button id="save-note-btn">Simpan</button>
            <span id="save-message"></span>
        </div>
    </div>

    <!-- Script JavaScript Internal -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Logika Jam Real-Time
            const clockElement = document.getElementById("digital-clock");
            const dateElement = document.getElementById("digital-date");

            function updateTime() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                clockElement.textContent = `${hours}:${minutes}:${seconds}`;

                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                dateElement.textContent = now.toLocaleDateString('id-ID', options);
            }
            updateTime();
            setInterval(updateTime, 1000);

            // 2. Logika Pemutar Musik Lo-Fi
            const playBtn = document.getElementById("play-music-btn");
            const audioPlayer = document.getElementById("lofi-audio");
            const musicStatus = document.getElementById("music-status");
            let isPlaying = false;

            playBtn.addEventListener("click", () => {
                if (isPlaying) {
                    audioPlayer.pause();
                    playBtn.textContent = "🎧 Play Lofi Beats";
                    musicStatus.textContent = "Status: Paused";
                    isPlaying = false;
                } else {
                    audioPlayer.play().then(() => {
                        playBtn.textContent = "⏸️ Pause Music";
                        musicStatus.textContent = "Status: Playing Cozy Beats 🎶";
                        isPlaying = true;
                    }).catch(error => {
                        console.error("Gagal memutar:", error);
                        alert("Ketuk sekali lagi untuk mengizinkan audio diputar.");
                    });
                }
            });

            // 3. Logika Memori HP (Local Storage)
            const noteInput = document.getElementById("user-note");
            const saveBtn = document.getElementById("save-note-btn");
            const saveMessage = document.getElementById("save-message");

            // Ambil data yang tersimpan sebelumnya
            const savedNote = localStorage.getItem("cozy_user_note");
            if (savedNote) {
                noteInput.value = savedNote;
            }

            // Simpan data saat tombol diklik
            saveBtn.addEventListener("click", () => {
                localStorage.setItem("cozy_user_note", noteInput.value);
                saveMessage.textContent = "Tersimpan! ✅";
                setTimeout(() => {
                    saveMessage.textContent = "";
                }, 2500);
            });
        });
    </script>
</body>
          </html>
